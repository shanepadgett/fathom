[package]
name = "fathom-desktop"
version = "0.1.0"
description = "The Fathom desktop shell: one window around the Elixir host"
authors = []
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "fathom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# `unstable` enables several webviews in one window (`Window::add_child`), used
# for browser tabs. Still unstable as of Tauri 2.12.
tauri = { version = "2.12.1", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
