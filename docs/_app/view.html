<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/" />
  <title>Doc</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
/* __DOCS_THEME__ */
  </script>

  <script src="https://unpkg.com/lucide@0.511.0"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

  <style type="text/tailwindcss">
/* __DOCS_STYLES__ */
  </style>
</head>
<body class="flex h-full flex-col overflow-hidden">
  <header class="flex shrink-0 items-stretch border-b border-line bg-panel">
    <a
      href="/"
      class="inline-flex shrink-0 items-center gap-2.5 border-r border-line px-5 text-sm font-medium tracking-tight text-ink hover:bg-soft"
    >
      <i data-lucide="arrow-left" class="h-4 w-4"></i>
      All docs
    </a>
    <div class="min-w-0 flex-1 px-6 py-4 text-right">
      <h1 id="doc-title" class="text-base font-semibold tracking-tight text-ink">Loading…</h1>
      <p id="doc-summary" class="mt-1 text-sm leading-6 text-mute"></p>
    </div>
  </header>

  <div class="flex min-h-0 flex-1 bg-canvas">
    <aside
      data-nav-aside
      class="w-56 shrink-0 overflow-hidden"
      style="background: linear-gradient(to right, #ececee 0%, #f3f3f4 42%, rgb(250 250 250 / 0.35) 72%, rgb(250 250 250 / 0) 100%)"
    >
      <nav
        data-nav
        class="h-full overflow-y-auto px-3 pt-10 pb-10"
        aria-label="Sections"
      ></nav>
    </aside>

    <main id="doc-main" class="min-w-0 flex-1 overflow-y-auto">
      <div class="px-8 py-10 pl-4 lg:px-14 lg:pl-8">
        <p id="doc-status" class="mb-4 hidden text-sm text-mute"></p>
        <div id="doc-content"></div>
      </div>
    </main>
  </div>

  <script src="/_app/blocks.js"></script>
  <script src="/_app/shell.js"></script>
  <script>
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
