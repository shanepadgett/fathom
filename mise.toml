[tools]
deno = "2.9.6"
markdownlint-cli2 = "0.23.2"
oxlint = "1.81.0"
oxfmt = "0.66.0"
"github:fallow-rs/fallow" = "3.23.0"

[tasks."lint:markdown"]
description = "Lint markdown and apply fixes"
run = "markdownlint-cli2 --fix"

[tasks."lint:oxlint"]
description = "Lint JavaScript and TypeScript with safe fixes"
run = "oxlint --fix"

[tasks."lint:oxfmt"]
description = "Format source and config files with oxfmt"
run = "oxfmt"

[tasks."lint:fallow"]
description = "Find dead code in the design reference"
dir = "{{config_root}}/design"
run = "fallow dead-code --unused-files --unused-exports --unused-types --unused-deps --unused-enum-members --unused-class-members --fail-on-issues --no-cache"

[tasks.design]
description = "Open the local design system"
dir = "{{config_root}}/design"
run = "deno task dev --open"

[tasks.baseline]
description = "Launch the native-Cordis baseline app"
dir = "{{config_root}}/baseline"
run = "deno task start"

[tasks."integration:desktop"]
description = "Launch the built integration desktop app in its own workspace"
dir = "{{config_root}}/prototype-integration"
run = 'FATHOM_WORKSPACE="$PWD" ./dist/Fathom.app/Contents/MacOS/laufey'
