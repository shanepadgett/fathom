[tools]
deno = "2.9.7"
python = "3.14"

[tasks.design]
description = "Open the local design system"
dir = "{{config_root}}/design"
run = "deno task dev --open"

[tasks.app]
description = "Build the UI and open Fathom in its native window with hot reload"
run = "deno task dev"

[tasks.browser]
description = "Build the UI and run Fathom in a browser tab for DevTools"
run = "deno task dev:browser"

[tasks.fmt]
description = "Format source and project configuration with Oxfmt"
run = "deno run -A oxfmt --write ."

[tasks."fmt:check"]
description = "Check formatting without changing files"
run = "deno run -A oxfmt --check ."

[tasks.lint]
description = "Lint TypeScript and Solid code with Oxlint"
run = "deno run -A oxlint --deny-warnings apps packages plugins"

[tasks."lint:fix"]
description = "Apply safe Oxlint fixes"
run = "deno run -A oxlint --fix apps packages plugins"

[tasks."lint:deno"]
description = "Check Deno code and JSR public types"
run = "deno lint"

[tasks.typecheck]
description = "Type-check the Deno workspace"
run = "deno task check"

[tasks."docs:check"]
description = "Fail when the generated reference docs are stale"
run = "deno task docs --check"

[tasks."publish:check"]
description = "Dry-run the JSR publish of the SDK"
dir = "{{config_root}}/packages/sdk"
run = "deno publish --dry-run --allow-dirty"

[tasks.check]
description = "Check formatting, lint, types, and generated docs"
depends = ["fmt:check", "lint", "lint:deno", "typecheck", "docs:check"]
