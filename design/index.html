<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Design — Fathom</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fragment+Mono:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
    <script>
    let theme = matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark"
      : "light";
    try {
      const saved = localStorage.getItem("fathom-design-theme");
      if (saved === "light" || saved === "dark") theme = saved;
    } catch { /* Theme still works without storage. */ }
    document.documentElement.dataset.theme = theme;
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/main.ts"></script>
  </head>
  <body>
    <design-app></design-app>
  </body>
</html>
